<title>Peintre Pro DZ</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">

<style>
  /* ------------------------------------------------------------------
     Palette : vert atelier et ocre sur un fond plâtre, reprise du thème
     Material 3 de l'application Android.

     color-scheme est déclaré dans les trois états : c'est ce qui empêche
     Chrome et Samsung Internet d'appliquer leur « mode sombre forcé », qui
     assombrit le fond sans toucher au texte — d'où l'écriture noire
     illisible. La page gère son propre thème, le navigateur n'y touche plus.
     ------------------------------------------------------------------ */
  :root {
    color-scheme: light;

    --platre: #F2F0E9;
    --papier: #FFFFFF;
    --encre: #16201F;
    --estompe: #56635F;
    --trait: #DCD8CD;
    --atelier: #1B5E5A;
    --atelier-fonce: #0E3E3B;
    --atelier-doux: #D7E9E6;
    --ocre: #C07617;
    --ocre-douce: #FAEBD2;
    --ombre: rgba(22, 32, 31, 0.10);

    /* Séries des graphiques — validées (bande de clarté, chroma, écart
       daltonien, contraste) sur la surface des cartes. */
    --serie-encaisse: #00897B;
    --serie-reste: #C07617;

    --brouillon: #9A6A06;
    --envoye: #1565C0;
    --accepte: #2E7D32;
    --refuse: #C62828;
    --annule: #5E6B67;

    --r: 16px;
    --gouttiere: 16px;
    --titre: 'Archivo', 'IBM Plex Sans', system-ui, sans-serif;
    --texte: 'IBM Plex Sans', 'IBM Plex Sans Arabic', system-ui, sans-serif;
    --chiffres: 'IBM Plex Mono', ui-monospace, monospace;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;

      --platre: #101615;
      --papier: #1B2423;
      --encre: #EEF3F1;
      --estompe: #A4B2AE;
      --trait: #32403D;
      --atelier: #6FBDB4;
      --atelier-fonce: #9BD5CD;
      --atelier-doux: #24352F;
      --ocre: #F0B453;
      --ocre-douce: #3A2E17;
      --ombre: rgba(0, 0, 0, 0.45);

      --serie-encaisse: #26A69A;
      --serie-reste: #C08420;

      --brouillon: #E0A81F;
      --envoye: #6BA6E8;
      --accepte: #74C47A;
      --refuse: #EF7B76;
      --annule: #94A19D;
    }
  }

  :root[data-theme="dark"] {
    color-scheme: dark;

    --platre: #101615;
    --papier: #1B2423;
    --encre: #EEF3F1;
    --estompe: #A4B2AE;
    --trait: #32403D;
    --atelier: #6FBDB4;
    --atelier-fonce: #9BD5CD;
    --atelier-doux: #24352F;
    --ocre: #F0B453;
    --ocre-douce: #3A2E17;
    --ombre: rgba(0, 0, 0, 0.45);

    --serie-encaisse: #26A69A;
    --serie-reste: #C08420;

    --brouillon: #E0A81F;
    --envoye: #6BA6E8;
    --accepte: #74C47A;
    --refuse: #EF7B76;
    --annule: #94A19D;
  }

  * { box-sizing: border-box; }

  [hidden] { display: none !important; }
  img, svg { max-width: 100%; }

  body {
    margin: 0;
    background: var(--platre);
    color: var(--encre);
    font-family: var(--texte);
    font-size: 17px;
    line-height: 1.45;
    -webkit-text-size-adjust: 100%;
  }

  :root[lang="ar"] body { font-family: 'IBM Plex Sans Arabic', var(--texte); }

  h1, h2, h3 { font-family: var(--titre); font-weight: 700; margin: 0; text-wrap: balance; }

  /* ---------------------------------------------------------- ossature */

  .app { max-width: 720px; margin: 0 auto; min-height: 100%; }

  .barre {
    position: sticky;
    top: env(safe-area-inset-top, 0px);
    z-index: 20;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 12px var(--gouttiere);
    background: var(--atelier);
    color: #FFFFFF;
    box-shadow: 0 2px 10px var(--ombre);
  }
  :root[data-theme="dark"] .barre,
  .barre { color: #FFFFFF; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) .barre { background: var(--atelier-doux); color: var(--encre); }
  }
  :root[data-theme="dark"] .barre { background: var(--atelier-doux); color: var(--encre); }

  .barre h1 { font-size: 19px; letter-spacing: 0.01em; flex: 1; min-width: 0;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  .barre button {
    background: rgba(255,255,255,0.18);
    color: inherit;
    border: 0;
    border-radius: 11px;
    min-width: 42px;
    min-height: 42px;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 7px 10px;
    font: inherit;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
  }
  [dir="rtl"] #btnRetour svg { transform: scaleX(-1); }
  .barre button:hover { background: rgba(255,255,255,0.28); }

  main { padding: 16px var(--gouttiere) 64px; display: flex; flex-direction: column; gap: 14px; }

  /* ------------------------------------------------------------ blocs */

  .carte {
    background: var(--papier);
    border: 1px solid var(--trait);
    border-radius: var(--r);
    padding: 16px;
  }
  .carte > h2 {
    font-size: 13px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--atelier);
    margin-bottom: 12px;
    font-family: var(--texte);
    font-weight: 600;
  }

  .grille2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .grille3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  @media (max-width: 430px) { .grille3 { grid-template-columns: 1fr; } }

  .tuile {
    background: var(--papier);
    border: 1px solid var(--trait);
    border-radius: var(--r);
    padding: 14px;
  }
  .tuile.phare { background: var(--ocre-douce); border-color: var(--ocre); }
  .tuile .etiq { font-size: 13px; color: var(--estompe); }
  .tuile .val { font-family: var(--titre); font-size: 24px; font-weight: 700; margin-top: 4px;
    font-variant-numeric: tabular-nums; }
  .tuile .val.petit { font-size: 19px; }

  /* ----------------------------------------------------------- boutons */

  .btn {
    display: flex;
    align-items: center;
    gap: 12px;
    width: 100%;
    min-height: 58px;
    padding: 12px 16px;
    border: 0;
    border-radius: var(--r);
    background: var(--atelier);
    color: #FFFFFF;
    font: inherit;
    font-weight: 600;
    font-size: 17px;
    text-align: start;
    cursor: pointer;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) .btn { color: #0E1918; }
  }
  :root[data-theme="dark"] .btn { color: #0E1918; }
  .btn:hover { filter: brightness(1.08); }
  .btn .ico, .note .ico, .banniere .ico { display: flex; align-items: center; line-height: 1; }
  .btn.eclair { background: var(--ocre); color: #2A1B00; min-height: 68px; font-size: 19px; }
  .btn.second {
    background: transparent;
    color: var(--atelier);
    border: 1.5px solid var(--atelier);
    min-height: 50px;
    font-size: 16px;
  }
  .btn.danger { background: transparent; color: var(--refuse); border: 1.5px solid var(--refuse); min-height: 46px; font-size: 15px; }
  .btn.mini { width: auto; min-height: 38px; padding: 8px 12px; font-size: 14px; }

  .rangeeBtn { display: flex; gap: 10px; flex-wrap: wrap; }

  /* ------------------------------------------------------------ champs */

  label.champ { display: block; margin-bottom: 12px; }
  label.champ > span {
    display: block;
    font-size: 13px;
    font-weight: 500;
    color: var(--estompe);
    margin-bottom: 5px;
  }
  input, select, textarea {
    width: 100%;
    padding: 12px;
    font: inherit;
    font-size: 16px;
    color: var(--encre);
    background: var(--platre);
    border: 1.5px solid var(--trait);
    border-radius: 10px;
  }
  :root[lang="ar"] input, :root[lang="ar"] select, :root[lang="ar"] textarea { font-family: 'IBM Plex Sans Arabic', var(--texte); }
  input:focus, select:focus, textarea:focus, button:focus-visible, [tabindex]:focus-visible {
    outline: 3px solid var(--ocre);
    outline-offset: 1px;
  }
  input[type="number"], input.nombre { font-family: var(--chiffres); font-variant-numeric: tabular-nums; }
  textarea { min-height: 76px; resize: vertical; }
  .erreur input, .erreur select { border-color: var(--refuse); }
  .msgErreur { color: var(--refuse); font-size: 13px; margin-top: 4px; }

  .interrupteur { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
  .interrupteur span { flex: 1; }
  .interrupteur input { width: 52px; height: 30px; accent-color: var(--atelier); }

  /* ------------------------------------------------------------ listes */

  .ligne {
    display: flex;
    align-items: center;
    gap: 12px;
    width: 100%;
    padding: 14px;
    background: var(--papier);
    border: 1px solid var(--trait);
    border-radius: var(--r);
    text-align: start;
    font: inherit;
    color: inherit;
    cursor: pointer;
  }
  .ligne:hover { border-color: var(--atelier); }
  .ligne .corps { flex: 1; min-width: 0; }
  .ligne .nom { font-weight: 600; }
  .ligne .detail { font-size: 14px; color: var(--estompe); }
  .ligne .montant { font-family: var(--chiffres); font-variant-numeric: tabular-nums; font-weight: 500; white-space: nowrap; }
  .pile { display: flex; flex-direction: column; gap: 10px; }

  .vide { text-align: center; color: var(--estompe); padding: 22px 12px; font-size: 15px; }

  .pastille {
    display: inline-block;
    padding: 3px 10px;
    border-radius: 999px;
    font-size: 13px;
    font-weight: 600;
    color: #FFFFFF;
    white-space: nowrap;
  }
  .p-BROUILLON { background: var(--brouillon); }
  .p-ENVOYE { background: var(--envoye); }
  .p-ACCEPTE { background: var(--accepte); }
  .p-REFUSE { background: var(--refuse); }
  .p-ANNULE { background: var(--annule); }

  .puces { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; }
  .puce {
    flex: 0 0 auto;
    padding: 8px 13px;
    border-radius: 999px;
    border: 1.5px solid var(--trait);
    background: var(--papier);
    color: var(--encre);
    font: inherit;
    font-size: 14px;
    cursor: pointer;
  }
  .puce[aria-pressed="true"] { background: var(--atelier); border-color: var(--atelier); color: #FFFFFF; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) .puce[aria-pressed="true"] { color: #0E1918; }
  }
  :root[data-theme="dark"] .puce[aria-pressed="true"] { color: #0E1918; }

  /* ------------------------------------------------------------ totaux */

  .tot { display: flex; align-items: baseline; gap: 12px; padding: 5px 0; }
  .tot dt { flex: 1; color: var(--estompe); font-size: 15px; }
  .tot dd { margin: 0; font-family: var(--chiffres); font-variant-numeric: tabular-nums; }
  .tot.fort dt { color: var(--encre); font-weight: 600; font-size: 17px; }
  .tot.fort dd { font-weight: 500; font-size: 17px; }
  .tot.grand dt { font-family: var(--titre); font-size: 19px; color: var(--encre); }
  .tot.grand dd { font-size: 21px; font-weight: 500; }
  hr { border: 0; border-top: 1px solid var(--trait); margin: 10px 0; }

  .note {
    display: flex;
    gap: 10px;
    padding: 12px;
    background: var(--ocre-douce);
    border-radius: 12px;
    font-size: 14px;
    line-height: 1.4;
  }
  .note .ico { flex: 0 0 auto; }

  /* ------------------------------------------------------------- modal */

  .voile {
    position: fixed;
    inset: 0;
    background: rgba(10, 18, 17, 0.55);
    display: flex;
    align-items: flex-end;
    justify-content: center;
    z-index: 50;
    padding: 12px;
  }
  @media (min-width: 560px) { .voile { align-items: center; } }
  .modal {
    background: var(--papier);
    border-radius: 18px;
    padding: 18px;
    width: 100%;
    max-width: 520px;
    max-height: 88vh;
    overflow-y: auto;
  }
  .modal h2 { font-size: 19px; margin-bottom: 14px; }

  /* ------------------------------------------------------- feuille PDF */

  .feuille {
    background: #FFFFFF;
    color: #16201F;
    border: 1px solid var(--trait);
    border-radius: 10px;
    padding: 22px;
    font-size: 14px;
  }
  .feuille .enTete { display: flex; justify-content: space-between; gap: 16px; flex-wrap: wrap;
    border-bottom: 3px solid var(--atelier); padding-bottom: 12px; }
  .feuille .marque { font-family: var(--titre); font-size: 20px; color: var(--atelier); font-weight: 700; }
  .feuille .num { font-family: var(--titre); font-size: 18px; text-align: end; }
  .feuille h3 { font-size: 12px; text-transform: uppercase; letter-spacing: 0.08em; color: #5E6C6A;
    margin: 16px 0 6px; font-family: var(--texte); font-weight: 600; }
  .tableWrap { overflow-x: auto; }
  .feuille table { width: 100%; border-collapse: collapse; font-size: 13px; min-width: 460px; }
  .feuille th {
    text-align: start;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: #5E6C6A;
    border-bottom: 1.5px solid #DFDCD2;
    padding: 7px 6px;
  }
  .feuille td { padding: 7px 6px; border-bottom: 1px solid #EFEDE6; vertical-align: top; }
  .feuille td.n { text-align: end; font-family: var(--chiffres); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .feuille .recap { margin-inline-start: auto; max-width: 320px; margin-top: 14px; }
  .feuille .recap .tot dt { color: #5E6C6A; }
  .feuille .recap .tot.grand dt, .feuille .recap .tot.fort dt { color: #16201F; }
  .signature { margin-top: 26px; display: flex; justify-content: space-between; gap: 20px; flex-wrap: wrap; }
  .signature div { flex: 1 1 200px; border-top: 1px solid #B9B5A9; padding-top: 6px; font-size: 12px; color: #5E6C6A; }

  .banniere {
    background: var(--atelier-doux);
    border: 1px solid var(--atelier);
    border-radius: 12px;
    padding: 12px 14px;
    font-size: 14px;
    display: flex;
    gap: 12px;
    align-items: flex-start;
  }
  .banniere .corps { flex: 1; }

  .pdp { font-size: 13px; color: var(--estompe); text-align: center; padding: 6px 0 0; }

  /* ------------------------------------------------- tableau de bord */

  .heros {
    position: relative;
    overflow: hidden;
    background: var(--atelier);
    color: #FFFFFF;
    border-radius: 20px;
    padding: 18px;
  }
  :root[data-theme="dark"] .heros { background: var(--atelier-doux); color: var(--encre); }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) .heros { background: var(--atelier-doux); color: var(--encre); }
  }
  .heros .etiq {
    font-size: 13px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    opacity: 0.85;
  }
  .heros .somme {
    font-family: var(--titre);
    font-size: 34px;
    font-weight: 700;
    line-height: 1.1;
    margin-top: 6px;
    font-variant-numeric: tabular-nums;
  }
  .heros .dessin {
    position: absolute;
    inset-inline-end: 10px;
    top: 10px;
    width: 96px;
    opacity: 0.5;
    pointer-events: none;
  }

  /* Barre empilée encaissé / reste : 2 px de fond entre les segments. */
  .empilee {
    display: flex;
    gap: 2px;
    height: 14px;
    margin-top: 16px;
    border-radius: 7px;
    overflow: hidden;
    background: transparent;
  }
  .empilee span { display: block; height: 100%; }
  .empilee .vide0 { flex: 1; background: rgba(255,255,255,0.28); }

  .legende {
    display: flex;
    flex-wrap: wrap;
    gap: 6px 18px;
    margin-top: 12px;
    font-size: 14px;
  }
  .legende div { display: flex; align-items: center; gap: 7px; }
  .legende i {
    width: 12px;
    height: 12px;
    border-radius: 3px;
    flex: 0 0 auto;
  }
  .legende b { font-family: var(--chiffres); font-weight: 500; font-variant-numeric: tabular-nums; }

  /* Tuiles chiffrées */
  .tuiles { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
  .tuile2 {
    background: var(--papier);
    border: 1px solid var(--trait);
    border-radius: var(--r);
    padding: 14px;
    display: flex;
    gap: 12px;
    align-items: flex-start;
  }
  .tuile2 .puceIco {
    width: 38px;
    height: 38px;
    border-radius: 11px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex: 0 0 auto;
    background: var(--atelier-doux);
    color: var(--atelier);
  }
  .tuile2.ocre .puceIco { background: var(--ocre-douce); color: var(--ocre); }
  .tuile2 .corps2 { min-width: 0; display: flex; flex-direction: column; }
  .tuile2 .val2 {
    font-family: var(--titre);
    font-size: 22px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
  }
  .tuile2 .etiq2 { font-size: 13px; color: var(--estompe); line-height: 1.25; }

  /* Graphique en barres */
  .graphe { width: 100%; height: auto; display: block; }
  .graphe .barre { cursor: pointer; }
  .graphe text { font-family: var(--texte); }
  .infoGraphe {
    margin-top: 8px;
    font-size: 14px;
    color: var(--estompe);
    min-height: 20px;
  }
  .infoGraphe b { color: var(--encre); font-family: var(--chiffres); font-weight: 500; }

  /* Répartition par statut */
  .rangStatut { display: flex; align-items: center; gap: 10px; padding: 5px 0; font-size: 14px; }
  .rangStatut .nomStatut { width: 84px; flex: 0 0 auto; }
  .rangStatut .piste { flex: 1; height: 12px; background: var(--trait); border-radius: 6px; overflow: hidden; }
  .rangStatut .piste span { display: block; height: 100%; border-radius: 6px; }
  .rangStatut .nb { width: 26px; text-align: end; font-family: var(--chiffres); font-variant-numeric: tabular-nums; }

  /* Grille des grands boutons */
  .actions { display: grid; grid-template-columns: 1fr; gap: 10px; }
  @media (min-width: 520px) { .actions { grid-template-columns: 1fr 1fr; } }
  .actions .btn.eclair { grid-column: 1 / -1; }

  .btn .puceIco {
    width: 34px;
    height: 34px;
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex: 0 0 auto;
    background: rgba(255,255,255,0.18);
  }
  .btn.eclair .puceIco { background: rgba(42,27,0,0.14); }

  .titreSection {
    font-family: var(--titre);
    font-size: 13px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--estompe);
    margin: 6px 0 -4px;
  }

  @media print {
    .barre, .noPrint { display: none !important; }
    body, .app, main { background: #FFFFFF; padding: 0; margin: 0; max-width: none; gap: 0; }
    .feuille { border: 0; padding: 0; }
  }

  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>

<div class="app">
  <header class="barre">
    <button id="btnRetour" type="button" hidden data-act="retour"></button>
    <h1 id="titreBarre">PEINTRE PRO DZ</h1>
    <button type="button" data-act="theme" id="btnTheme"></button>
    <button type="button" data-act="langue" id="btnLangue">ع</button>
  </header>
  <main id="vue"></main>
</div>
<div id="modale"></div>

<script>
(function () {
  "use strict";

  /* =================================================================
     1. Traductions — le français est la langue par défaut, l'arabe
        bascule aussi la page en lecture de droite à gauche (RTL).
     ================================================================= */

  var T = {
    fr: {
      titre: "PEINTRE PRO DZ", sousTitre: "Devis et chantiers de peinture",
      retour: "Retour", enregistrer: "Enregistrer", annuler: "Annuler", supprimer: "Supprimer",
      modifier: "Modifier", ajouter: "Ajouter", fermer: "Fermer", ok: "OK", confirmer: "Confirmer",
      dupliquer: "Dupliquer", reinit: "Réinitialiser", rechercher: "Rechercher",
      statDevis: "Devis", statAcceptes: "Devis acceptés", statChantiers: "Chantiers en cours",
      statEncaisser: "Montant à encaisser",
      nouveauDevis: "Nouveau devis", mesDevis: "Mes devis", mesChantiers: "Mes chantiers",
      mesClients: "Mes clients", paiements: "Paiements", parametres: "Paramètres",
      calculRapide: "CALCUL RAPIDE", ceMois: "Ce mois", moisCrees: "Devis créés",
      moisAcceptes: "Devis acceptés", moisChantiers: "Chantiers terminés",
      moisMontant: "Montant des devis (non encaissé)", moisEncaisse: "Montant encaissé",
      moisRestant: "Montant restant à encaisser",
      clients: "Mes clients", clientNouveau: "Nouveau client", clientModifier: "Modifier le client",

  var NOMS_MOIS = {

    ar: ["جانفي", "فيفري", "مارس", "أفريل", "ماي", "جوان", "جويلية", "أوت", "سبتمبر", "أكتوبر", "نوفمبر", "ديسمبر"]
  };

  /** Montant des devis créés sur chacun des six derniers mois. */
  function sixDerniersMois() {
    var aujourdhui = new Date();
    var mois = [];
    for (var i = 5; i >= 0; i--) {
      var d = new Date(aujourdhui.getFullYear(), aujourdhui.getMonth() - i, 1);
      mois.push({
        debut: d.getTime(),
        fin: new Date(d.getFullYear(), d.getMonth() + 1, 1).getTime(),
        label: (NOMS_MOIS[langue] || NOMS_MOIS.fr)[d.getMonth()],
        valeur: 0
      });
    }
    E.devis.forEach(function (d) {
      var montant = totaux(d).total;
      for (var i = 0; i < mois.length; i++) {
        if (d.date >= mois[i].debut && d.date < mois[i].fin) { mois[i].valeur += montant; break; }
      }
    });
    return mois;
  }

  /**
   * Barres verticales : une seule série, donc pas de légende — le titre
   * de la carte dit ce qui est mesuré. Seule la plus haute barre porte son
   * montant ; les autres se lisent en touchant la barre.
   */
  function graphiqueMois(mois) {
    var max = 0;
    mois.forEach(function (m) { if (m.valeur > max) { max = m.valeur; } });
    if (max <= 0) {
      return '<p class="vide">' + esc(t("tbAucuneDonnee")) + "</p>";
    }

    var L = 320, H = 168, hautPad = 22, basPad = 30;
    var pas = L / mois.length;
    var largeurBarre = pas - 14;
    var hauteurUtile = H - hautPad - basPad;
    var indexMax = 0;
    mois.forEach(function (m, i) { if (m.valeur >= mois[indexMax].valeur) { indexMax = i; } });

    var corps = mois.map(function (m, i) {
      var h = m.valeur > 0 ? Math.max(3, (m.valeur / max) * hauteurUtile) : 0;
      var x = i * pas + 7;
      var y = hautPad + (hauteurUtile - h);
      var barre = h > 0
        ? '<rect class="barre" x="' + x + '" y="' + y + '" width="' + largeurBarre + '" height="' + h +
          '" rx="4" fill="var(--serie-encaisse)" data-act="barreMois" data-id="' + i + '"><title>' +
          esc(m.label + " : " + argent(m.valeur)) + "</title></rect>"
        : "";
      var etiquette = i === indexMax
        ? '<text x="' + (x + largeurBarre / 2) + '" y="' + (y - 7) + '" text-anchor="middle" ' +
          'font-size="11" fill="var(--encre)">' + esc(nfMontant.format(Math.round(m.valeur))) + "</text>"
        : "";
      return barre + etiquette +
        '<text x="' + (x + largeurBarre / 2) + '" y="' + (H - 10) +
        '" text-anchor="middle" font-size="11" fill="var(--estompe)">' + esc(m.label) + "</text>";
    }).join("");

    return '<svg class="graphe" viewBox="0 0 ' + L + " " + H + '" role="img" ' +
      'aria-label="' + esc(t("tbMoisTitre")) + '">' +
      '<line x1="0" y1="' + (H - basPad) + '" x2="' + L + '" y2="' + (H - basPad) +
      '" stroke="var(--trait)" stroke-width="1"/>' + corps + "</svg>" +
      '<p class="infoGraphe" id="infoGraphe">' + esc(t("tbToucherBarre")) + "</p>";
  }

  /** Part encaissée et part restant à encaisser, sur une seule barre. */
  function barreEncaissement(encaisse, reste) {
    var total = encaisse + reste;
    var partA = total > 0 ? Math.round((encaisse / total) * 100) : 0;
    var partB = total > 0 ? 100 - partA : 0;
    var segments = total > 0
      ? '<span style="width:' + partA + '%;background:var(--serie-encaisse)"></span>' +
        '<span style="width:' + partB + '%;background:var(--serie-reste)"></span>'
      : '<span class="vide0"></span>';
    return '<div class="empilee">' + segments + "</div>" +
      '<div class="legende">' +
      '<div><i style="background:var(--serie-encaisse)"></i>' + esc(t("tbEncaisse")) +
      " <b>" + esc(argent(encaisse)) + "</b></div>" +
      '<div><i style="background:var(--serie-reste)"></i>' + esc(t("tbResteCourt")) +
      " <b>" + esc(argent(reste)) + "</b></div>" +
      "</div>";
  }

  /** Répartition des devis par statut : la couleur ne porte jamais seule. */
  function repartitionStatuts() {
    var compte = {};
    STATUTS.forEach(function (s) { compte[s] = 0; });
    E.devis.forEach(function (d) { compte[d.statut] = (compte[d.statut] || 0) + 1; });
    var max = 0;
    STATUTS.forEach(function (s) { if (compte[s] > max) { max = compte[s]; } });
    if (max === 0) { return '<p class="vide">' + esc(t("tbAucuneDonnee")) + "</p>"; }

    return STATUTS.map(function (s) {
      var part = Math.round((compte[s] / max) * 100);
      return '<div class="rangStatut">' +
        '<span class="nomStatut">' + esc(t(s)) + "</span>" +
        '<span class="piste"><span style="width:' + part + '%;background:var(--' +
        s.toLowerCase() + ')"></span></span>' +
        '<span class="nb">' + compte[s] + "</span></div>";
    }).join("");
  }

  /* Redessine un bloc en rendant au champ actif EXACTEMENT ce que la personne
     a tapé : sans cela, taper « 0, » repasserait par le formatage et viderait
     le champ au milieu de la saisie. */
  function redessinerBloc(idBloc, html) {
    var bloc = document.getElementById(idBloc);
    if (!bloc) { return; }
    var actif = document.activeElement;
    var champActif = actif && actif.dataset ? actif.dataset.champ : null;
    var brut = champActif ? actif.value : null;
    var pos = champActif ? actif.selectionStart : null;
    bloc.innerHTML = html;
    if (!champActif) { return; }
    var suivant = bloc.querySelector('[data-champ="' + champActif + '"]');
    if (!suivant) { return; }
    if (brut !== null && suivant.value !== brut) { suivant.value = brut; }
    suivant.focus();
    try { suivant.setSelectionRange(pos, pos); } catch (e) {}
  }

  function objetPieceCalcul(f) {
    var p = piece("");
    p.longueur = n(f.longueur); p.largeur = n(f.largeur); p.hauteur = n(f.hauteur);

    p.fenetres = parseInt(f.fenetres, 10) || 0;

    var s = surfaces(objetPieceCalcul(f));
    var aire = f.plafond ? s.net + s.plafond : s.net;
    var couches = parseInt(f.couches, 10) || 0;
    var L = litres(aire, couches, n(f.rendement));
    var pots = conditionnement(L);
    var prix = aire * n(f.prix);
    return '<h2>' + esc(t("resultat")) + "</h2>" +
      tot(t("surfaceMurs"), m2(s.murs)) +
      tot(t("surfaceOuvertures"), m2(s.ouvertures)) +
      tot(t("surfaceNette"), m2(s.net), "fort") +
      tot(t("surfacePlafond"), m2(s.plafond)) +
      "<hr>" +
      tot(t("quantitePeinture"), lit(L), "fort") +
      (pots.length ? tot(t("potsProposes"), pots.map(function (x) { return x.nb + " × " + dec(x.taille) + " L"; }).join(" + ")) : "") +
      tot(t("prixEstime"), argent(prix)) +

  var ligneEnCours = null;

  function modaleLigne(devisId, ligneId, pieceId) {
    var d = devis(devisId);
    if (!d) { return; }
    var existante = (d.lignes || []).filter(function (x) { return x.id === ligneId; })[0];
    var p = (d.pieces || []).filter(function (x) { return x.id === (existante ? existante.pieceId : pieceId); })[0];
    var s = p ? surfaces(p) : null;

    ligneEnCours = existante
      ? { id: existante.id, devisId: devisId, pieceId: existante.pieceId, categorie: existante.categorie,
          designation: existante.designation, unite: existante.unite, qte: saisie(existante.qte), pu: saisie(existante.pu) }
      : { id: null, devisId: devisId, pieceId: pieceId || null, categorie: "TRAVAUX",
          designation: "", unite: "M2", qte: s ? dec(s.net) : "", pu: "" };

    var tarifs = E.tarifs.filter(function (x) { return x.niveau === d.niveau; });
    var bases = s ? [
      { l: t("baseMurs"), v: dec(s.net) },
      { l: t("basePlafond"), v: dec(s.plafond) },
      { l: t("baseMursPlafond"), v: dec(s.net + s.plafond) },
      { l: t("basePortes"), v: String(p.portes || 0) },
      { l: t("baseFenetres"), v: String(p.fenetres || 0) }
    ] : [];

    ouvrirModale(
      "<h2>" + esc(existante ? t("ligneModifier") : t("ligneAjouter")) + "</h2>" +
      liste(t("depuisTarifs"), "lTarif",

    confirmer(t("toutEffacerT"), t("actionDefinitive"), function () {
      E.clients = []; E.devis = []; E.exemple = false;
      sauver(); dessiner();
    });
  };

  A.toutEffacer = function () {
    confirmer(t("toutEffacerT"), t("actionDefinitive"), function () {
      E = donneesExemple();
      E.clients = []; E.devis = []; E.exemple = false;
      sauver();
      pile = [];
      vue = { nom: "accueil", ctx: {} };
      dessiner();
    });
  };

  /* --------------------------------------------------------- clients */

  A.clientNouveau = function () { aller("clientForm", {}); };
  A.clientModifier = function (id) { aller("clientForm", { id: id }); };

  A.clientEnregistrer = function (id) {
    var nom = valeur("cNom");
    if (!nom.trim()) {
      var err = document.getElementById("errClient");
      if (err) { err.hidden = false; }
      return;
    }
    var c = id ? client(id) : null;
    if (c) {
      c.nom = nom.trim(); c.tel = valeur("cTel").trim();
      c.adresse = valeur("cAdresse").trim(); c.notes = valeur("cNotes").trim();
    } else {
      c = { id: id2(), nom: nom.trim(), tel: valeur("cTel").trim(), adresse: valeur("cAdresse").trim(), notes: valeur("cNotes").trim() };
      E.clients.push(c);
    }
    sauver();
    retour();
  };

  function id2() { return id(); }

  A.clientSupprimer = function (cid) {
    if (E.devis.some(function (d) { return d.clientId === cid; })) {
      info(t("clientAvecDevis"));
      return;
    }
    confirmer(t("supprimerClientT"), t("actionDefinitive"), function () {
      E.clients = E.clients.filter(function (c) { return c.id !== cid; });
      sauver();
      retour();
    });
  };

  /* ----------------------------------------------------------- devis */

  A.nouveauDevis = function () {
    var d = {
      id: id(), numero: prochainNumero(), clientId: E.clients.length === 1 ? E.clients[0].id : null,
      typeChantier: "APPARTEMENT", adresse: "", date: Date.now(), notes: "",
      niveau: "STANDARD", statut: "BROUILLON", remise: 0,
      tvaActive: !!E.params.tvaActive, tvaTaux: E.params.tvaTaux, acompte: 0,
      validite: E.params.validite, pieces: [], lignes: [], paiements: []
    };
    E.devis.push(d);
    sauver();
    aller("devisForm", { id: d.id });
  };

  A.devisSupprimer = function (did) {
    confirmer(t("supprimerDevisT"), t("supprimerDevisM"), function () {
      E.devis = E.devis.filter(function (d) { return d.id !== did; });
      sauver();
      pile = [];
      vue = { nom: "devis", ctx: {} };
      dessiner();
    });
  };

  A.devisDupliquer = function (did) {
    var src = devis(did);
    if (!src) { return; }
    var copie = JSON.parse(JSON.stringify(src));
    copie.id = id();
    copie.numero = prochainNumero();
    copie.statut = "BROUILLON";
    copie.acompte = 0;
    copie.paiements = [];
    copie.date = Date.now();
    var map = {};
    copie.pieces.forEach(function (p) { var ancien = p.id; p.id = id(); map[ancien] = p.id; });
    copie.lignes.forEach(function (l) { l.id = id(); l.pieceId = l.pieceId ? (map[l.pieceId] || null) : null; });
    E.devis.push(copie);
    sauver();
    aller("devisForm", { id: copie.id });
  };

  A.filtreStatut = function (s) {
    vue.ctx.statut = s || null;
    dessiner();
  };
  A.apercu = function (did) { aller("apercu", { id: did }); };

  A.imprimer = function () { try { window.print(); } catch (e) { info(t("phase2")); } };

  A.partager = function (did) {
    var d = devis(did);
    if (!d) { return; }
    var c = client(d.clientId);
    var x = totaux(d);
    var texteDevis = (E.params.entreprise || "PEINTRE PRO DZ") + "\n" +
      d.numero + " — " + dateCourte(d.date) + "\n" +
      (c ? t("pourClient") + " : " + c.nom + "\n" : "") +
      t("TOTAL") + " : " + argent(x.total) + "\n" +
      (x.acompte ? t("acompte") + " : " + argent(x.acompte) + "\n" : "") +
      t("resteAPayer") + " : " + argent(x.reste);

    if (navigator.share) {
      navigator.share({ title: d.numero, text: texteDevis }).catch(function () {});
    } else if (navigator.clipboard) {
      navigator.clipboard.writeText(texteDevis).then(function () { info(t("copieDansPresse")); },
        function () { info(texteDevis); });
    } else {
      info(texteDevis);
    }
  };

  /* ---------------------------------------------------------- pièces */

  A.pieceNouvelle = function () { aller("pieceForm", { devisId: vue.ctx.id }); };
  A.piece = function (pid) { aller("pieceForm", { devisId: vue.ctx.id, id: pid }); };

  A.pieceEnregistrer = function () {
    if (!enregistrerPiece()) { return; }
    retour();
  };

  function enregistrerPiece() {
    var d = devis(vue.ctx.devisId);
    var p = vue.ctx.brouillon;
    if (!d || !p) { return false; }
    var err = document.getElementById("errPiece");
    var s = surfaces(p);
    if (!String(p.nom).trim()) {
      if (err) { err.textContent = t("nomPieceObligatoire"); err.hidden = false; }
      return false;
    }
    if (!s.manuelMur && (n(p.longueur) <= 0 || n(p.largeur) <= 0 || n(p.hauteur) <= 0)) {
      if (err) { err.textContent = t("dimObligatoires"); err.hidden = false; }
      return false;
    }
    if (err) { err.hidden = true; }
    var existante = (d.pieces || []).filter(function (x) { return x.id === p.id; })[0];
    if (!existante) { d.pieces.push(p); vue.ctx.id = p.id; }
    sauver();
    return true;
  }

  A.pieceSupprimer = function (pid) {
    confirmer(t("supprimerPieceT"), t("supprimerPieceM"), function () {
      var d = devis(vue.ctx.devisId);
      if (!d) { return; }
      d.pieces = d.pieces.filter(function (p) { return p.id !== pid; });
      d.lignes = d.lignes.filter(function (l) { return l.pieceId !== pid; });
      sauver();
      retour();
    });
  };

  A.travailNouveau = function () {
    if (!enregistrerPiece()) { return; }
    modaleLigne(vue.ctx.devisId, null, vue.ctx.brouillon.id);
  };

  /* ---------------------------------------------------------- lignes */

  A.ligneNouvelle = function () { modaleLigne(vue.ctx.id, null, null); };

  A.ligne = function (lid) {
    var did = vue.nom === "pieceForm" ? vue.ctx.devisId : vue.ctx.id;
    modaleLigne(did, lid, null);
  };

  A.base = function (valeurBase) {
    var champQte = document.querySelector('[data-champ="lQte"]');
    if (champQte) {
      champQte.value = valeurBase;
      ligneEnCours.qte = valeurBase;
      majTotalLigne();
    }
  };

  A.ligneEnregistrer = function () {
    var d = devis(ligneEnCours.devisId);
    if (!d) { return; }
    if (!String(ligneEnCours.designation).trim()) {
      var err = document.getElementById("errLigne");
      if (err) { err.hidden = false; }
      return;
    }
    var donnee = {
      categorie: ligneEnCours.categorie,
      designation: String(ligneEnCours.designation).trim(),
      unite: ligneEnCours.unite,
      qte: Math.max(0, n(ligneEnCours.qte)),
      pu: Math.max(0, n(ligneEnCours.pu))
    };
    if (ligneEnCours.id) {
      var l = d.lignes.filter(function (x) { return x.id === ligneEnCours.id; })[0];
      if (l) { Object.keys(donnee).forEach(function (k) { l[k] = donnee[k]; }); }
    } else {
      donnee.id = id();
      donnee.pieceId = ligneEnCours.pieceId || null;
      d.lignes.push(donnee);
    }
    sauver();
    fermerModale();
    dessiner();
  };

  A.ligneSupprimer = function (lid) {
    var d = devis(ligneEnCours.devisId);
    if (!d) { return; }
    d.lignes = d.lignes.filter(function (x) { return x.id !== lid; });
    sauver();
    fermerModale();
    dessiner();
  };

  function majTotalLigne() {
    var bloc = document.getElementById("totalLigne");
    if (bloc) {
      bloc.innerHTML = tot(t("total"), argent(n(ligneEnCours.qte) * n(ligneEnCours.pu)), "fort");
    }
  }

  /* ---------------------------------------------------------- tarifs */

  A.filtreNiveau = function (nv) { vue.ctx.niveau = nv; dessiner(); };
  A.tarifNouveau = function (nv) { modaleTarif(null, nv); };
  A.tarif = function (tid) { modaleTarif(tid, null); };

  A.tarifEnregistrer = function () {
    if (!String(tarifEnCours.label).trim()) {
      var err = document.getElementById("errTarif");
      if (err) { err.hidden = false; }
      return;
    }
    if (tarifEnCours.id) {
      var x = E.tarifs.filter(function (y) { return y.id === tarifEnCours.id; })[0];
      if (x) {
        x.label = String(tarifEnCours.label).trim();
        x.prix = Math.max(0, n(tarifEnCours.prix));
        x.unite = tarifEnCours.unite;
        x.categorie = tarifEnCours.categorie;
        x.niveau = tarifEnCours.niveau;
      }
    } else {
      E.tarifs.push({
        id: id(), label: String(tarifEnCours.label).trim(), prix: Math.max(0, n(tarifEnCours.prix)),
        unite: tarifEnCours.unite, categorie: tarifEnCours.categorie, niveau: tarifEnCours.niveau
      });
    }
    sauver();
    fermerModale();
    dessiner();
  };

  A.tarifSupprimer = function (tid) {
    E.tarifs = E.tarifs.filter(function (x) { return x.id !== tid; });
    sauver();
    fermerModale();
    dessiner();
  };

  A.tarifsReinit = function () {
    confirmer(t("reinitTarifsT"), t("reinitTarifsM"), function () {
      E.tarifs = tarifsParDefaut();
      sauver();
      dessiner();
    });
  };

  /* ---------------------------------------------------- calcul rapide */

  A.calculVersDevis = function () {
    var f = vue.ctx.f;
    var p = objetPieceCalcul(f);
    p.nom = t("piece") + " 1";
    var s = surfaces(p);
    var aire = f.plafond ? s.net + s.plafond : s.net;
    var couches = parseInt(f.couches, 10) || 2;

    var d = {
      id: id(), numero: prochainNumero(), clientId: E.clients.length === 1 ? E.clients[0].id : null,
      typeChantier: "APPARTEMENT", adresse: "", date: Date.now(), notes: "",
      niveau: "STANDARD", statut: "BROUILLON", remise: 0,
      tvaActive: !!E.params.tvaActive, tvaTaux: E.params.tvaTaux, acompte: 0,
      validite: E.params.validite,
      pieces: [p],
      lignes: [{
        id: id(), pieceId: p.id, categorie: "TRAVAUX",
        designation: (langue === "ar" ? "دهن " + couches + " طبقة" : "Peinture " + couches + " couche(s)"),
        unite: "M2", qte: arrondi(aire), pu: n(f.prix)
      }],
      paiements: []
    };
    E.devis.push(d);
    sauver();
    aller("devisForm", { id: d.id });
  };

  /* ------------------------------------------------------ export JSON */

  A.exporter = function () {
    var json = JSON.stringify(E, null, 2);
    ouvrirModale(
      "<h2>" + esc(t("exporter")) + "</h2><p>" + esc(t("exporterM")) + "</p>" +
      '<textarea id="zoneExport" style="min-height:180px;font-family:var(--chiffres);font-size:12px" readonly>' +
      esc(json) + "</textarea>" +
      '<div class="rangeeBtn" style="margin-top:12px">' +
      bouton(t("copier"), "copierExport", "mini") +
      bouton(t("fermer"), "fermerModale", "second mini") +
      "</div>"
    );
  };

  A.copierExport = function () {
    var zone = document.getElementById("zoneExport");
    if (!zone) { return; }
    zone.select();
    if (navigator.clipboard) {
      navigator.clipboard.writeText(zone.value).then(function () { info(t("copie")); }, function () {});
    } else {
      try { document.execCommand("copy"); info(t("copie")); } catch (e) {}
    }
  };

  A.importer = function () {
    ouvrirModale(
      "<h2>" + esc(t("importer")) + "</h2><p>" + esc(t("importerM")) + "</p>" +
      '<textarea id="zoneImport" style="min-height:180px;font-family:var(--chiffres);font-size:12px"></textarea>' +
      '<div class="rangeeBtn" style="margin-top:12px">' +
      bouton(t("importerAction"), "importerValider", "danger mini") +
      bouton(t("annuler"), "fermerModale", "second mini") +
      "</div>"
    );
  };

  A.importerValider = function () {
    var zone = document.getElementById("zoneImport");
    if (!zone) { return; }
    try {
      var obj = JSON.parse(zone.value);
      if (!obj || !Array.isArray(obj.clients) || !Array.isArray(obj.devis) || !obj.params) {
        throw new Error("format");
      }
      E = obj;
      if (!Array.isArray(E.tarifs) || !E.tarifs.length) { E.tarifs = tarifsParDefaut(); }
      sauver();
      fermerModale();
      pile = [];
      vue = { nom: "accueil", ctx: {} };
      dessiner();
      info(t("importOk"));
    } catch (e) {
      info(t("importErreur"));
    }
  };

  /* =================================================================
     10. Saisie — un seul écouteur pour tous les champs
     ================================================================= */

  function valeur(nomChamp) {
    var el = document.querySelector('[data-champ="' + nomChamp + '"]');
    return el ? el.value : "";
  }

  var CHAMPS = {
    rechercheClient: function (v) { vue.ctx.q = v; redessinerListe("qClients"); },
    rechercheDevis: function (v) { vue.ctx.q = v; redessinerListe("qDevis"); },
    filtrePeriode: function (v) { vue.ctx.periode = v; dessiner(); },

    dClient: function (v) { majDevis(function (d) { d.clientId = v || null; }); dessiner(); },
    dDate: function (v) { majDevis(function (d) { var x = new Date(v); if (!isNaN(x.getTime())) { d.date = x.getTime(); } }); },
    dType: function (v) { majDevis(function (d) { d.typeChantier = v; }); },
    dAdresse: function (v) { majDevis(function (d) { d.adresse = v; }); },
    dNiveau: function (v) { majDevis(function (d) { d.niveau = v; }); },
    dStatut: function (v) { majDevis(function (d) { d.statut = v; }); },
    dNotes: function (v) { majDevis(function (d) { d.notes = v; }); },
    dRemise: function (v) { majDevis(function (d) { d.remise = Math.max(0, n(v)); }); majTotaux(); },
    dAcompte: function (v) { majDevis(function (d) { d.acompte = Math.max(0, n(v)); }); majTotaux(); },
    dTva: function (v, el) { majDevis(function (d) { d.tvaActive = el.checked; }); majTotaux(); },
    dTvaTaux: function (v) { majDevis(function (d) { d.tvaTaux = Math.max(0, n(v)); }); majTotaux(); },

    pNom: function (v) { vue.ctx.brouillon.nom = v; },
    pLongueur: function (v) { vue.ctx.brouillon.longueur = n(v); majSurfaces(); },
    pLargeur: function (v) { vue.ctx.brouillon.largeur = n(v); majSurfaces(); },
    pHauteur: function (v) { vue.ctx.brouillon.hauteur = n(v); majSurfaces(); },
    pPortes: function (v) { vue.ctx.brouillon.portes = parseInt(v, 10) || 0; majSurfaces(); },
    pPortesL: function (v) { vue.ctx.brouillon.portesL = n(v); majSurfaces(); },
    pPortesH: function (v) { vue.ctx.brouillon.portesH = n(v); majSurfaces(); },
    pFenetres: function (v) { vue.ctx.brouillon.fenetres = parseInt(v, 10) || 0; majSurfaces(); },
    pFenetresL: function (v) { vue.ctx.brouillon.fenetresL = n(v); majSurfaces(); },
    pFenetresH: function (v) { vue.ctx.brouillon.fenetresH = n(v); majSurfaces(); },
    pManuel: function (v, el) {
      var p = vue.ctx.brouillon, s = surfaces(p);
      if (el.checked) { p.murManuel = arrondi(s.net); p.plafondManuel = arrondi(s.plafond); }
      else { p.murManuel = null; p.plafondManuel = null; }
      majSurfaces();
    },
    pMurManuel: function (v) { vue.ctx.brouillon.murManuel = Math.max(0, n(v)); },
    pPlafondManuel: function (v) { vue.ctx.brouillon.plafondManuel = Math.max(0, n(v)); },

    qLongueur: function (v) { vue.ctx.f.longueur = v; majCalcul(); },
    qLargeur: function (v) { vue.ctx.f.largeur = v; majCalcul(); },
    qHauteur: function (v) { vue.ctx.f.hauteur = v; majCalcul(); },
    qPortes: function (v) { vue.ctx.f.portes = v; majCalcul(); },
    qFenetres: function (v) { vue.ctx.f.fenetres = v; majCalcul(); },
    qCouches: function (v) { vue.ctx.f.couches = v; majCalcul(); },
    qRendement: function (v) { vue.ctx.f.rendement = v; majCalcul(); },
    qPrix: function (v) { vue.ctx.f.prix = v; majCalcul(); },
    qPlafond: function (v, el) { vue.ctx.f.plafond = el.checked; majCalcul(); },

    lTarif: function (v) {
      var x = E.tarifs.filter(function (y) { return y.id === v; })[0];
      if (!x) { return; }
      ligneEnCours.designation = x.label;
      ligneEnCours.unite = x.unite;
      ligneEnCours.categorie = x.categorie;
      ligneEnCours.pu = saisie(x.prix);
      ecrire("lDesignation", x.label);
      ecrire("lUnite", x.unite);
      ecrire("lCategorie", x.categorie);
      ecrire("lPu", saisie(x.prix));
      majTotalLigne();
    },
    lDesignation: function (v) { ligneEnCours.designation = v; },
    lCategorie: function (v) { ligneEnCours.categorie = v; },
    lUnite: function (v) { ligneEnCours.unite = v; },
    lQte: function (v) { ligneEnCours.qte = v; majTotalLigne(); },
    lPu: function (v) { ligneEnCours.pu = v; majTotalLigne(); },

    tLabel: function (v) { tarifEnCours.label = v; },
    tPrix: function (v) { tarifEnCours.prix = v; },
    tUnite: function (v) { tarifEnCours.unite = v; },
    tCategorie: function (v) { tarifEnCours.categorie = v; },
    tNiveau: function (v) { tarifEnCours.niveau = v; },

    sEntreprise: function (v) { E.params.entreprise = v; sauver(); },
    sTel: function (v) { E.params.tel = v; sauver(); },
    sAdresse: function (v) { E.params.adresse = v; sauver(); },
    sEmail: function (v) { E.params.email = v; sauver(); },
    sDevise: function (v) { E.params.devise = v.trim() || "DA"; sauver(); },
    sTva: function (v, el) { E.params.tvaActive = el.checked; sauver(); },
    sTvaTaux: function (v) { E.params.tvaTaux = Math.max(0, n(v)); sauver(); },
    sValidite: function (v) { E.params.validite = Math.max(0, parseInt(v, 10) || 0); sauver(); },
    sRendement: function (v) { E.params.rendement = Math.max(0.1, n(v)); sauver(); },
    sCouches: function (v) { E.params.couches = Math.min(5, Math.max(1, parseInt(v, 10) || 1)); sauver(); },
    sConditions: function (v) { E.params.conditions = v; sauver(); }
  };

  function ecrire(nomChamp, v) {
    var el = document.querySelector('[data-champ="' + nomChamp + '"]');
    if (el) { el.value = v; }
  }

  function majDevis(f) {
    var d = devis(vue.ctx.id);
    if (d) { f(d); sauver(); }
  }

  function majCalcul() {
    var bloc = document.getElementById("blocCalcul");
    if (bloc) { bloc.innerHTML = htmlCalcul(vue.ctx.f); }
  }

  /* Redessine la liste sans perdre le curseur du champ de recherche. */
  function redessinerListe(idChamp) {
    var actif = document.getElementById(idChamp);
    var pos = actif ? actif.selectionStart : null;
    dessiner();
    var suivant = document.getElementById(idChamp);
    if (suivant) {
      suivant.focus();
      try { suivant.setSelectionRange(pos, pos); } catch (e) {}
    }
  }

  /* =================================================================
     11. Écouteurs
     ================================================================= */

  document.addEventListener("click", function (ev) {
    var el = ev.target.closest("[data-act]");
    if (!el) { return; }
    var acte = el.getAttribute("data-act");
    if (acte === "voile" && !ev.target.classList.contains("voile")) { return; }
    if (A[acte]) {
      ev.preventDefault();
      A[acte](el.getAttribute("data-id"), el, ev);
    }
  });

  function surSaisie(ev) {
    var el = ev.target.closest("[data-champ]");
    if (!el) { return; }
    var nomChamp = el.getAttribute("data-champ");
    if (CHAMPS[nomChamp]) { CHAMPS[nomChamp](el.value, el); }
  }
  document.addEventListener("input", surSaisie);
  document.addEventListener("change", function (ev) {
    var el = ev.target.closest("[data-champ]");
    if (el && (el.tagName === "SELECT" || el.type === "checkbox" || el.type === "date")) { surSaisie(ev); }
  });

  document.addEventListener("pointerover", function (ev) {
    if (!ev.target || !ev.target.closest) { return; }
    var barre = ev.target.closest('[data-act="barreMois"]');
    if (barre) { A.barreMois(barre.getAttribute("data-id")); }
  });

  document.addEventListener("keydown", function (ev) {
    if (ev.key === "Escape") { fermerModale(); }
  });

  appliquerTheme();
  appliquerLangue();
  dessiner();
})();
</script>
