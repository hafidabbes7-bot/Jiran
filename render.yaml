# Déploiement en un clic, depuis un navigateur — aucun ordinateur nécessaire.
#
# ⚠️ CONFIGURATION D'ESSAI, pas de production. Aucun SMS n'est envoyé : le code
# de vérification est rempli automatiquement dans l'application, pour pouvoir
# faire essayer à des voisins sans contrat d'agrégateur. Pour un vrai
# lancement, il faut renseigner SMS_PROVIDER et retirer EXPOSE_DEV_CODE
# (voir server/README.md).
#
# La base PostgreSQL est créée par Render en même temps que le service, et son
# adresse est posée toute seule : il n'y a aucun mot de passe à copier, donc
# aucun à laisser traîner dans le dépôt.
#
# ⚠️ Une base gratuite Render est supprimée 30 jours après sa création (plus
# 14 jours de sursis pour passer à une formule payante). C'est la solution qui
# marche tout de suite ; pour garder les données au-delà, passez à Supabase,
# gratuit et sans date de péremption — docs/base-de-donnees.md explique comment,
# et ça ne change qu'une variable.
#
# Les réglages facultatifs — numéros des modérateurs, identifiants WhatsApp —
# ne figurent pas ici : Render refuse une variable sans valeur. Ils s'ajoutent
# dans l'onglet Environment du service, une fois celui-ci créé.
services:
  - type: web
    name: jiran-essai
    runtime: node
    plan: free
    region: frankfurt
    # `npm run build` finit par `npm run migrate` : le schéma est posé à la
    # construction, avant que le service ne démarre — jamais au démarrage.
    buildCommand: npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: '22.20.0'

      # Adresse de la base, remplie par Render à partir de la base déclarée
      # plus bas. Rien à copier, rien à coller, et aucun mot de passe ne passe
      # par ce fichier — donc aucun n'entre dans le dépôt.
      #
      # Pour utiliser Supabase à la place (voir docs/base-de-donnees.md),
      # remplacez ces trois lignes par `sync: false` et collez l'adresse dans
      # l'onglet Environment du service.
      - key: DATABASE_URL
        fromDatabase:
          name: jiran-base
          property: connectionString

      # Stockage des photos (Supabase Storage), facultatif. Sans ces valeurs,
      # les photos sont rangées dans la base elle-même : ça marche, mais ça
      # remplit vite le gigaoctet offert. La clé de service donne tous les
      # droits sur le stockage : elle se colle dans l'onglet Environment du
      # service, jamais ici.
      #   Supabase → Project Settings → API → service_role
      - key: SUPABASE_BUCKET
        value: jiran-photos

      # Adresse publique, pour fabriquer les liens de confirmation envoyés par
      # e-mail. Laissée vide, le serveur la déduit de la requête reçue — juste
      # dans presque tous les cas. À renseigner avec un domaine à soi.
      - key: PUBLIC_URL
        sync: false

      # Secrets tirés au hasard par l'hébergeur : ils ne passent jamais par le
      # dépôt ni par un écran.
      - key: OTP_SECRET
        generateValue: true
      - key: SESSION_SECRET
        generateValue: true

      # Porte explicite : sans elle, le serveur refuse de démarrer avec des
      # fournisseurs qui n'envoient rien, puisque l'hébergeur le déclare en
      # production. À retirer avant d'ouvrir à de vrais voisins.
      - key: TRIAL_MODE
        value: 'true'

      # Le code s'affiche dans l'application au lieu d'être envoyé par SMS.
      - key: SMS_PROVIDER
        value: console
      # Canal e-mail : le seul gratuit à l'envoi. En « console » il n'envoie
      # rien — le code s'affiche à l'écran — mais le choix du canal est déjà
      # visible à l'inscription. Passez à « smtp » ou « resend » en ajoutant
      # les identifiants : voir docs/verification-reelle.md.
      - key: EMAIL_PROVIDER
        value: console
      - key: PUSH_PROVIDER
        value: console

      # Jeton du webhook WhatsApp, généré d'avance : il servira le jour où la
      # vérification gratuite sera activée (docs/verification-whatsapp.md).
      - key: WHATSAPP_VERIFY_TOKEN
        generateValue: true

# La base du contenu. Render la crée, la sauvegarde et fournit son adresse au
# service ci-dessus. `plan: free` donne 1 Go — largement de quoi démarrer, le
# ménage quotidien s'occupant de ne pas le remplir.
databases:
  - name: jiran-base
    databaseName: jiran
    user: jiran
    plan: free
    region: frankfurt
    postgresMajorVersion: '16'
